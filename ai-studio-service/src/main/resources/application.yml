    name: ai-studio-service
  datasource:
    # url: jdbc:mysql://100.70.4.15:3307/dev_iip_ai_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
