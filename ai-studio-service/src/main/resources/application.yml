# Skill GitLab 集成配置
skill:
  gitlab:
    # GitLab 服务器地址
    url: ${GITLAB_URL:https://git.qualink.com}
    # GitLab 访问 Token（Deploy Token 或 Personal Access Token）
    token: ${GITLAB_TOKEN:glpat--v8mTUpmBc1sv1_Ps2wA}
    # 仓库 ID（数字 ID，用于深层级子组项目）
