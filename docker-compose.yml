services:
  ai-studio-service:
    build:
      context: ./ai-studio-service
    image: ai-studio-service:local
    container_name: ai-studio-service
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_SERVLET_CONTEXT_PATH: ${SERVER_SERVLET_CONTEXT_PATH:-/ai-studio/v1}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      RSA_PRIVATE_KEY: ${RSA_PRIVATE_KEY:-}
      RSA_PUBLIC_KEY: ${RSA_PUBLIC_KEY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_DOWNLOAD_URL: ${OSS_DOWNLOAD_URL:-}
      OSS_REGION: ${OSS_REGION:-sd-jn-scyd-gyhlwzq-icp}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      GITLAB_ACTIVITY_API_BASE_URL: ${GITLAB_ACTIVITY_API_BASE_URL:-}
      GITLAB_ACTIVITY_PRIVATE_TOKEN: ${GITLAB_ACTIVITY_PRIVATE_TOKEN:-}
      GITLAB_ACTIVITY_WEBHOOK_TOKEN: ${GITLAB_ACTIVITY_WEBHOOK_TOKEN:-}
      GITLAB_ACTIVITY_SCHEDULES_ENABLED: ${GITLAB_ACTIVITY_SCHEDULES_ENABLED:-false}
      GITLAB_ACTIVITY_DAILY_ANALYZE_CRON: ${GITLAB_ACTIVITY_DAILY_ANALYZE_CRON:-0 15 20 * * ?}
      GITLAB_ACTIVITY_DAILY_REPORT_CRON: ${GITLAB_ACTIVITY_DAILY_REPORT_CRON:-0 30 20 * * ?}
      GITLAB_ACTIVITY_BACKFILL_CRON: ${GITLAB_ACTIVITY_BACKFILL_CRON:-0 0/30 * * * ?}
    restart: unless-stopped

  ai-studio-admin-web:
    build:
      context: .
      dockerfile: apps/ai-studio-admin-web/Dockerfile
    image: ai-studio-admin-web:local
    container_name: ai-studio-admin-web
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      - ai-studio-service
    restart: unless-stopped

  ai-studio-console-web:
    build:
      context: .
      dockerfile: apps/ai-studio-console-web/Dockerfile
    image: ai-studio-console-web:local
    container_name: ai-studio-console-web
    ports:
      - "${CONSOLE_PORT:-8082}:80"
    depends_on:
      - ai-studio-service
    restart: unless-stopped

  ai-studio-portal-web:
    build:
      context: .
      dockerfile: apps/ai-studio-portal-web/Dockerfile
    image: ai-studio-portal-web:local
    container_name: ai-studio-portal-web
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    depends_on:
      - ai-studio-service
    environment:
      NUXT_API_BASE_URL: ${NUXT_API_BASE_URL:-http://ai-studio-service:8080/ai-studio/v1}
      NUXT_LOGIN_TYPE: ${NUXT_LOGIN_TYPE:-own}
      NUXT_TOKEN_TYPE: ${NUXT_TOKEN_TYPE:-Bearer}
      NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
      NUXT_CONSOLE_BASE_URL: ${NUXT_CONSOLE_BASE_URL:-http://localhost:8082/ai-studio-plus-console-web}
      NUXT_KNOWLEDGE_API_BASE: ${NUXT_KNOWLEDGE_API_BASE:-http://localhost:3002/ai-studio/v1/knowledge}
    restart: unless-stopped
